<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="수능 타이머">
<meta name="theme-color" content="#f7f6f2">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>수능 실전 타이머</title>
<style>
:root{
  --navy:#4a5a78; --navy-l:#dfe3ec; --olive:#7a8456; --olive-l:#e6e8dc;
  --rose:#c38f97; --rose-l:#f3e4e6; --violet:#9d91bd; --violet-l:#ebe7f4;
  --bg:#f7f6f2; --card:#fff; --line:#e3e1da; --text:#3a4152; --muted:#8a8f9c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{
  font:300 13px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{
  min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);font-weight:400;cursor:pointer;touch-action:manipulation;
}
button:disabled{opacity:.35;cursor:default}
button.pri{background:var(--navy);border-color:var(--navy);color:#fff}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.warn{color:var(--rose)}
input,select,textarea{
  border:1px solid var(--line);border-radius:8px;background:var(--card);
  padding:8px 10px;min-height:40px;font-size:16px;font-weight:300;width:100%;
}
textarea{min-height:64px;resize:vertical}
.num{font-variant-numeric:tabular-nums}
h2{font-size:13px;font-weight:500;margin:22px 0 8px;color:var(--navy);letter-spacing:.02em}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 10px;flex-wrap:wrap}
header h1{font-size:14px;font-weight:500;margin:0;color:var(--navy);letter-spacing:.03em}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;min-height:36px;padding:0 12px;border-radius:8px;background:transparent;color:var(--muted);flex:1;white-space:nowrap}
.seg button.on{background:var(--navy-l);color:var(--navy)}
main{max-width:1080px;margin:0 auto}
header{max-width:1080px;margin:0 auto}

/* timer */
#subjSeg{margin:4px 0 14px}
.tgrid{display:grid;gap:16px}
@media (min-width:760px){.tgrid{grid-template-columns:minmax(320px,1fr) 1fr;align-items:start}}
.clockwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
#clock{width:min(84vw,360px);height:auto;display:block}
#clock .tick{stroke:#c9c7bf;stroke-width:.8}
#clock .tick.major{stroke:var(--navy);stroke-width:1.6}
#clock .n{font-size:10px;font-weight:300;fill:var(--navy);text-anchor:middle;dominant-baseline:central}
.digits{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:420px;text-align:center}
.digits div+div{border-left:1px solid var(--line)}
.digits .lbl{display:block;font-size:11px;color:var(--muted)}
.digits b{font-weight:300;font-size:22px;letter-spacing:.02em}
#dEl{color:var(--olive)} #dRem{color:var(--navy)}
#dRem.low{color:var(--rose)}
.bar{width:100%;max-width:420px;height:4px;background:var(--navy-l);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--olive);transition:width .25s linear}
.ctrl{display:grid;grid-template-columns:1fr 1.4fr 1.4fr 1fr;gap:8px;width:100%;max-width:420px}
.ctrl #bLap{background:var(--olive-l);border-color:var(--olive-l);color:var(--olive)}
.sub{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
.sub button{min-height:34px;font-size:12px}

.lapwrap{display:flex;flex-direction:column;gap:10px}
.laps{list-style:none;margin:0;padding:0}
.laps li{display:grid;grid-template-columns:24px 1fr auto auto;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}
.laps li .i{color:var(--muted);font-size:11px}
.laps li input{border:0;background:transparent;padding:4px 0;min-height:32px;font-size:15px}
.laps li .sp{font-size:15px;text-align:right}
.laps li .df{font-size:11px;min-width:56px;text-align:right}
.laps li .at{display:block;font-size:10px;color:var(--muted);text-align:right}
.laps li.live{color:var(--muted)}
.laps li.live .sp{color:var(--text)}
.laps .empty{display:block;color:var(--muted);border:0;padding:16px 2px}
.over{color:var(--rose)} .under{color:var(--olive)}
.lap-head{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:0 2px}
#donePanel{display:grid;gap:8px}
#donePanel .row{display:grid;grid-template-columns:1fr 2fr;gap:8px}
#donePanel .btns{display:grid;grid-template-columns:1fr 2fr;gap:8px}

/* focus mode */
body.focus header,body.focus #subjSeg{display:none}
body.focus #clock{width:min(88vw,70vh,560px)}
body.focus .tgrid{padding-top:12px}

/* tab bar (iPhone) */
@media (max-width:759px){
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  #nav{position:fixed;z-index:5;left:0;right:0;bottom:0;border:0;border-top:1px solid var(--line);border-radius:0;
    padding:4px max(8px,env(safe-area-inset-left)) calc(4px + env(safe-area-inset-bottom));
    background:rgba(247,246,242,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  #nav button{min-height:46px;font-size:12px}
  #nav button.on{background:transparent;font-weight:500}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))!important}
}

/* records */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tools button{min-height:36px;font-size:12px}
.rbar{display:grid;grid-template-columns:1fr 1fr auto;grid-template-areas:"q q q" "s a p";gap:8px;margin:10px 0}
@media (min-width:760px){.rbar{grid-template-columns:1fr 130px auto auto;grid-template-areas:"q s a p"}}
.rbar input{grid-area:q} .rbar select{grid-area:s} #bNewRec{grid-area:a} #bPrint{grid-area:p}
.rbar input,.rbar select{min-height:40px}
.rbar button{min-height:40px;font-size:12px}
.kv.kv4{grid-template-columns:repeat(4,1fr);margin:10px 0 4px}
.rsplit{display:grid;gap:16px}
#rdetail{display:none}
@media (min-width:900px){
  .rsplit{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}
  #rdetail{display:block;position:sticky;top:12px;max-height:calc(100dvh - 24px);overflow:auto}
}
.mhead{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:16px 4px 6px}
.glist{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;
  padding:11px 14px;min-height:auto;border:0;border-radius:0;font-weight:300;background:transparent}
.rrow+.rrow{border-top:1px solid var(--line)}
.rrow.sel{background:var(--navy-l)}
.rmid{display:grid;gap:4px;min-width:0}
.rmid .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr{text-align:right} .rr b{font-weight:300;font-size:17px;display:block}
.lbar{position:relative;display:flex;gap:1px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.lbar i{display:block;height:100%;flex:none}
.lbar.big{height:12px;border-radius:6px;overflow:visible}
.lbar.big i:first-child{border-radius:6px 0 0 6px}
.lbar .tk{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--text);opacity:.45}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
/* detail */
.dv{display:grid;gap:12px}
.dv .dh{display:flex;align-items:center;gap:8px}
.dv .dh .x{margin-left:auto}
.dv .big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dv .big b{font-size:34px;font-weight:200;letter-spacing:.01em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--bg);border:1px solid var(--line)}
.ltab{width:100%;border-collapse:collapse;font-size:12px}
.ltab th{font-weight:400;color:var(--muted);font-size:10px;text-align:right;padding:0 0 4px}
.ltab th:first-child,.ltab td:first-child{text-align:left}
.ltab td{padding:7px 0;border-top:1px solid var(--line);text-align:right}
.ltab tfoot td{color:var(--muted)}
.memo{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:12px}
.dnav{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.dempty{color:var(--muted);text-align:center;padding:40px 0}
#lastRec{text-align:left;width:100%;min-height:auto;padding:12px 14px;display:grid;gap:6px;font-weight:300}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--navy-l);color:var(--navy);white-space:nowrap}
.tag.eng{background:var(--olive-l);color:var(--olive)}
.tag.eth{background:var(--violet-l);color:#7a6ea0}
.meta{font-size:11px;color:var(--muted)}
.sc{display:block;font-size:11px;color:var(--violet);text-align:right}

/* dialog */
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px);background:var(--bg);color:var(--text)}
#dlgView{background:var(--card)}
#dlgView .dv{padding:18px}
@media (max-width:759px){
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:92dvh}
  dialog .dlg,#dlgView .dv{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
}
dialog::backdrop{background:rgba(58,65,82,.35)}
.dlg{padding:18px;display:grid;gap:10px}
.dlg h3{margin:0;font-size:14px;font-weight:500;color:var(--navy)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:grid;gap:4px;font-size:11px;color:var(--muted)}
.lapEd{display:grid;gap:6px}
.lapEd .r{display:grid;grid-template-columns:1fr 92px 40px;gap:6px}
.lapEd .r button{min-height:40px;padding:0}
.dlg .foot{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-top:6px}

/* stats */
.sgrid{display:grid;gap:12px}
@media (min-width:760px){.sgrid{grid-template-columns:repeat(3,1fr)}}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin:8px 0 10px}
.kv span{display:block;font-size:10px;color:var(--muted)}
.kv b{font-weight:300;font-size:16px}
.parts{width:100%;border-collapse:collapse;font-size:12px}
.parts td{padding:5px 0;border-top:1px solid var(--line)}
.parts td+td{text-align:right}
.chart{width:100%;height:auto;margin-top:8px}
.chart text{font-size:8px;fill:var(--muted)}

/* settings */
.tset{display:grid;gap:6px}
.tset .r{display:grid;grid-template-columns:1fr 80px 40px;gap:6px}
.tset .r button{min-height:40px;padding:0}
.sbars{display:grid;gap:5px;margin-top:10px;font-size:10px}
.sbars div{display:grid;grid-template-columns:52px 1fr 38px;gap:6px;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
[hidden]{display:none!important}
#printSheet{display:none}

/* print: A4 기록표 */
@page{size:A4;margin:14mm}
@media print{
  body{background:#fff;padding:0;font-size:10pt}
  header,main,dialog,.toast{display:none!important}
  #printSheet{display:block}
  #printSheet h1{font-size:13pt;font-weight:500;color:var(--navy);margin:0 0 2mm}
  #printSheet p{margin:0 0 5mm;color:var(--muted);font-size:9pt}
  #printSheet table{width:100%;border-collapse:collapse;font-size:9pt}
  #printSheet th{font-weight:500;text-align:left;border-bottom:1pt solid var(--navy);padding:2mm 1.5mm;color:var(--navy)}
  #printSheet td{border-bottom:.5pt solid var(--line);padding:2mm 1.5mm;vertical-align:top}
  #printSheet tr{break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <h1>수능 실전 타이머</h1>
  <nav class="seg" id="nav">
    <button data-v="timer" class="on">타이머</button>
    <button data-v="rec">기록</button>
    <button data-v="stat">통계</button>
    <button data-v="set">설정</button>
  </nav>
</header>

<main>
  <!-- 타이머 -->
  <section id="v-timer">
    <div class="seg" id="subjSeg"></div>
    <div class="tgrid">
      <div class="clockwrap">
        <svg id="clock" viewBox="0 0 200 200" aria-label="아날로그 시계"></svg>
        <div class="digits num">
          <div><span class="lbl">시각</span><b id="dNow">08:40:00</b></div>
          <div><span class="lbl">지난 시간</span><b id="dEl">00:00</b></div>
          <div><span class="lbl">남은 시간</span><b id="dRem">80:00</b></div>
        </div>
        <div class="bar"><i id="barFill"></i></div>
        <div class="ctrl">
          <button id="bReset">리셋</button>
          <button id="bMain" class="pri">시작</button>
          <button id="bLap">랩</button>
          <button id="bEnd">종료</button>
        </div>
        <div class="sub"><button id="bFocus" class="ghost">집중 모드</button><span id="wlState"></span></div>
      </div>
      <div class="lapwrap">
        <div class="lap-head"><span>구간 · 이름 탭하여 수정</span><span>구간 / 목표 대비</span></div>
        <ol class="laps num" id="laps"></ol>
        <div id="donePanel" class="card" hidden>
          <div class="row">
            <label class="f">점수<input id="dnScore" inputmode="numeric" placeholder="선택"></label>
            <label class="f">메모<input id="dnMemo" placeholder="선택"></label>
          </div>
          <div class="btns">
            <button id="bDiscard" class="warn">폐기</button>
            <button id="bSave" class="pri">기록 저장</button>
          </div>
        </div>
        <button id="lastRec" class="card" hidden></button>
      </div>
    </div>
  </section>

  <!-- 기록 -->
  <section id="v-rec" hidden>
    <div class="seg" id="recSeg"></div>
    <div class="kv kv4 num" id="rsum"></div>
    <div class="rbar">
      <input id="rq" type="search" placeholder="메모 · 구간 · 날짜 검색" autocomplete="off">
      <select id="rsort"><option value="new">최신순</option><option value="old">오래된순</option><option value="fast">소요 짧은순</option><option value="score">점수 높은순</option></select>
      <button id="bNewRec">+ 추가</button>
      <button id="bPrint">A4 인쇄</button>
    </div>
    <div class="rsplit">
      <div id="rlist"></div>
      <div id="rdetail" class="card"></div>
    </div>
  </section>

  <!-- 통계 -->
  <section id="v-stat" hidden>
    <div class="sgrid" id="sgrid"></div>
  </section>

  <!-- 설정 -->
  <section id="v-set" hidden>
    <h2>과목별 목표 구간 (랩 순서대로 매칭)</h2>
    <div class="sgrid" id="tsets"></div>
    <h2>데이터</h2>
    <div class="tools">
      <button id="bExport">내보내기 (JSON)</button>
      <button id="bImport">가져오기</button>
      <input type="file" id="fImport" accept="application/json,.json" hidden>
      <button id="bResetT">목표 기본값 복원</button>
      <button id="bWipe" class="warn">모든 기록 삭제</button>
    </div>
    <p class="muted">기록은 이 기기 브라우저에 저장됩니다. 기기 간 공유는 아래 Gist 동기화를 사용하세요.</p>
    <h2>Gist 동기화 (iPhone ↔ iPad)</h2>
    <div class="dlg" style="padding:0">
      <label class="f">GitHub 토큰 (gist 권한)<input id="syTok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ghp_… 또는 github_pat_…"></label>
      <label class="f">Gist ID (비우면 자동 검색·생성)<input id="syGist" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <div class="tools"><button id="bSync">저장 · 지금 동기화</button><button id="bSyncOff" class="warn">연결 해제</button></div>
      <p class="muted" id="syMsg" style="margin:0;font-size:12px"></p>
    </div>
  </section>
</main>

<dialog id="dlgView"><div class="dv" id="dvBody"></div></dialog>
<dialog id="dlg"><form class="dlg" method="dialog" id="edForm"></form></dialog>
<div id="printSheet"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const SUBJ = {
  kor: { name: '국어', s: 8 * 60 + 40, d: 80 },
  eng: { name: '영어', s: 13 * 60 + 10, d: 70 },
  eth: { name: '생활과 윤리', s: 15 * 60 + 35, d: 30 },
};
const SHORT = { kor: '국어', eng: '영어', eth: '생윤' };
const DEF_T = {
  kor: [['독서', 45], ['문학', 25], ['선택', 10]],
  eng: [['듣기', 25], ['독해', 45]],
  eth: [['전체', 30]],
};
const SPEED = Math.max(1, +new URLSearchParams(location.search).get('speed') || 1);

/* storage */
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const defTargets = () => Object.fromEntries(Object.entries(DEF_T).map(([k, a]) => [k, a.map(([name, min]) => ({ name, min }))]));

let targets = load('sn_targets', null) || defTargets();
let records = load('sn_records', []);
const idle = subj => ({ subj, status: 'idle', t0: 0, paused: 0, pAt: 0, final: 0, laps: [] });
let run = load('sn_run', null) || idle('kor');
const saveRun = () => store('sn_run', run);
let dels = load('sn_del', {});   // 삭제 기록 {id: ms} — 동기화용
let tU = load('sn_targets_u', 0);
const saveRecs = () => { store('sn_records', records); store('sn_del', dels); scheduleSync(); };
const saveTargets = () => { tU = Date.now(); store('sn_targets', targets); store('sn_targets_u', tU); scheduleSync(); };

/* format */
const pad = n => String(n).padStart(2, '0');
const fmt = sec => { sec = Math.max(0, Math.floor(sec)); return pad(Math.floor(sec / 60)) + ':' + pad(sec % 60); };
const fmtDiff = d => (d > 0 ? '+' : d < 0 ? '−' : '±') + fmt(Math.abs(d));
const clockStr = sec => { sec = Math.floor(sec); return pad(Math.floor(sec / 3600) % 24) + ':' + pad(Math.floor(sec / 60) % 60) + ':' + pad(sec % 60); };
const parseT = str => {
  str = String(str).trim(); if (!str) return NaN;
  if (str.includes(':')) { const [m, s] = str.split(':').map(Number); return m * 60 + (s || 0); }
  return Number(str) * 60;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dateStr = iso => { const d = new Date(iso); return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const toLocalInput = iso => { const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1600); };
const lapName = (subj, i) => targets[subj][i]?.name || `랩 ${i + 1}`;

/* ───────── clock ───────── */
const pt = (a, r) => { const t = a * Math.PI / 180; return [100 + r * Math.sin(t), 100 - r * Math.cos(t)]; };
const arcPath = (a0, a1, r) => {
  if (a1 < a0) a1 += 360;
  if (a1 - a0 < 0.05) return '';
  const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
};
const hourAngle = sec => (sec / 3600 % 12) * 30;
function buildClock() {
  let g = `<circle cx="100" cy="100" r="97" fill="#fff" stroke="var(--line)" stroke-width="1"/>`;
  for (let i = 0; i < 60; i++) {
    const major = i % 5 === 0, [x1, y1] = pt(i * 6, major ? 84 : 88), [x2, y2] = pt(i * 6, 92);
    g += `<line class="tick${major ? ' major' : ''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  }
  for (let h = 1; h <= 12; h++) { const [x, y] = pt(h * 30, 74); g += `<text class="n" x="${x}" y="${y}">${h}</text>`; }
  g += `<path id="arcT" fill="none" stroke="var(--navy-l)" stroke-width="7" stroke-linecap="round"/>
    <path id="arcE" fill="none" stroke="var(--olive)" stroke-width="7" stroke-linecap="round" opacity=".75"/>
    <circle id="endDot" r="2.6" fill="var(--rose)"/>
    <line id="hH" x1="100" y1="106" x2="100" y2="54" stroke="var(--navy)" stroke-width="3.4" stroke-linecap="round"/>
    <line id="hM" x1="100" y1="108" x2="100" y2="30" stroke="var(--navy)" stroke-width="2" stroke-linecap="round"/>
    <line id="hS" x1="100" y1="114" x2="100" y2="22" stroke="var(--rose)" stroke-width=".9" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="3" fill="var(--navy)"/><circle cx="100" cy="100" r="1.3" fill="var(--rose)"/>`;
  $('#clock').innerHTML = g;
}
function drawClock(el) {
  const S = SUBJ[run.subj], s0 = S.s * 60, vt = s0 + el, end = s0 + S.d * 60;
  const a0 = hourAngle(s0);
  $('#arcT').setAttribute('d', arcPath(a0, hourAngle(end), 60));
  $('#arcE').setAttribute('d', arcPath(a0, hourAngle(vt), 60));
  const [ex, ey] = pt((end / 60 % 60) * 6, 95.5);
  $('#endDot').setAttribute('cx', ex); $('#endDot').setAttribute('cy', ey);
  $('#hH').setAttribute('transform', `rotate(${hourAngle(vt)} 100 100)`);
  $('#hM').setAttribute('transform', `rotate(${(vt / 60 % 60) * 6} 100 100)`);
  $('#hS').setAttribute('transform', `rotate(${Math.floor(vt) % 60 * 6} 100 100)`);
}

/* ───────── timer core ───────── */
const D = () => SUBJ[run.subj].d * 60;
function elapsed() {
  const now = Date.now();
  if (run.status === 'running') return Math.min(D(), (now - run.t0 - run.paused) / 1000 * SPEED);
  if (run.status === 'paused') return Math.min(D(), (run.pAt - run.t0 - run.paused) / 1000 * SPEED);
  if (run.status === 'done') return run.final;
  return 0;
}
function tick() {
  const el = elapsed();
  if (run.status === 'running' && el >= D()) { finish(); return; }
  const S = SUBJ[run.subj], rem = D() - el;
  drawClock(el);
  $('#dNow').textContent = clockStr(S.s * 60 + el);
  $('#dEl').textContent = fmt(el);
  $('#dRem').textContent = fmt(Math.ceil(rem));
  $('#dRem').classList.toggle('low', rem <= 300 && run.status !== 'idle');
  $('#barFill').style.width = (el / D() * 100) + '%';
  const live = $('#liveLap');
  if (live) {
    const last = run.laps.length ? run.laps[run.laps.length - 1].at : 0, sp = el - last, t = targets[run.subj][run.laps.length];
    live.querySelector('.sp').textContent = fmt(sp);
    const df = live.querySelector('.df');
    if (t) { const d = sp - t.min * 60; df.textContent = d > 0 ? fmtDiff(d) : '/ ' + fmt(t.min * 60); df.className = 'df ' + (d > 0 ? 'over' : ''); }
  }
}
let timerId = null;
function loop(on) { clearInterval(timerId); timerId = on ? setInterval(tick, 200) : null; }

function renderTimer() {
  const st = run.status;
  document.querySelectorAll('#subjSeg button').forEach(b => { b.classList.toggle('on', b.dataset.s === run.subj); b.disabled = st !== 'idle' && b.dataset.s !== run.subj; });
  const m = $('#bMain');
  m.textContent = { idle: '시작', running: '일시정지', paused: '재개', done: '완료' }[st];
  m.disabled = st === 'done';
  $('#bLap').disabled = st !== 'running';
  $('#bEnd').disabled = st === 'idle' || st === 'done';
  $('#bReset').disabled = st === 'idle';
  $('#donePanel').hidden = st !== 'done';
  renderLaps(); renderLast(); tick();
  loop(st === 'running');
  wake(st === 'running');
}
function renderLaps() {
  const S = run.subj, T = targets[S];
  let prev = 0, h = '';
  run.laps.forEach((l, i) => {
    const sp = l.at - prev, t = T[i]; prev = l.at;
    let df = '';
    if (t) { const d = Math.round(sp - t.min * 60); df = `<span class="df ${d > 0 ? 'over' : 'under'}">${fmtDiff(d)}</span>`; } else df = '<span class="df"></span>';
    h += `<li><span class="i">${i + 1}</span><input data-i="${i}" value="${esc(l.name)}" aria-label="랩 이름"><span class="sp">${fmt(sp)}<span class="at">${clockStr(SUBJ[S].s * 60 + l.at).slice(0, 5)} · ${fmt(l.at)}</span></span>${df}</li>`;
  });
  if (run.status === 'running' || run.status === 'paused') {
    h += `<li class="live" id="liveLap"><span class="i">${run.laps.length + 1}</span><span>${esc(lapName(S, run.laps.length))} · 진행 중</span><span class="sp">00:00</span><span class="df"></span></li>`;
  }
  if (!h) {
    const plan = T.map(t => `${esc(t.name)} ${t.min}분`).join(' → ');
    h = `<li class="empty">시작 후 <b>랩</b>을 눌러 구간을 기록하세요.<br>목표: ${plan || '없음'}</li>`;
  }
  $('#laps').innerHTML = h;
}

function start() { run = { ...idle(run.subj), status: 'running', t0: Date.now() }; saveRun(); renderTimer(); }
function pause() { run.pAt = Date.now(); run.status = 'paused'; saveRun(); renderTimer(); }
function resume() { run.paused += Date.now() - run.pAt; run.pAt = 0; run.status = 'running'; saveRun(); renderTimer(); }
function lap() {
  const el = elapsed(), last = run.laps.length ? run.laps[run.laps.length - 1].at : 0;
  if (el - last < 1) return;
  run.laps.push({ name: lapName(run.subj, run.laps.length), at: el });
  saveRun(); renderLaps(); tick();
}
function finish() {
  const el = Math.round(elapsed()), last = run.laps.length ? run.laps[run.laps.length - 1].at : 0;
  if (run.laps.length && el - last >= 1) run.laps.push({ name: lapName(run.subj, run.laps.length), at: el });
  run.final = el; run.status = 'done';
  $('#dnScore').value = ''; $('#dnMemo').value = '';
  saveRun(); renderTimer();
  if (el >= D()) { toast('시험 시간 종료'); try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {} }
}
function saveRecord() {
  let prev = 0;
  const laps = run.laps.map(l => { const sec = Math.round(l.at - prev); prev = l.at; return { name: l.name, sec }; });
  const id = uid();
  records.unshift({ id, subj: run.subj, date: new Date(run.t0).toISOString(), total: Math.round(run.final), laps, score: $('#dnScore').value.trim(), memo: $('#dnMemo').value.trim(), u: Date.now() });
  saveRecs(); run = idle(run.subj); saveRun(); renderTimer(); showDlg(id); toast('기록 저장됨');
}
function resetRun() {
  if (run.status !== 'idle' && !confirm(run.status === 'done' ? '이번 기록을 폐기할까요?' : '진행 중인 타이머를 리셋할까요?')) return;
  run = idle(run.subj); saveRun(); renderTimer();
}

/* wake lock + focus */
let wl = null;
async function wake(on) {
  try {
    if (on && !wl && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; $('#wlState').textContent = ''; });
      $('#wlState').textContent = '화면 켜짐 유지 중';
    } else if (!on && wl) { await wl.release(); wl = null; }
  } catch (e) { $('#wlState').textContent = ''; }
}
function toggleFocus() {
  const on = document.body.classList.toggle('focus');
  $('#bFocus').textContent = on ? '집중 모드 해제' : '집중 모드';
  const de = document.documentElement;
  try {
    if (on) (de.requestFullscreen || de.webkitRequestFullscreen)?.call(de)?.catch?.(() => {});
    else if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } catch (e) {}
}

/* ───────── records ───────── */
const WD = '일월화수목금토';
const COL = ['#9aa7c0', '#b9bf98', '#d9b4ba', '#c3bad9', '#a8c4c0', '#d6c4a0'];
const dShort = iso => { const d = new Date(iso); return `${pad(d.getMonth() + 1)}.${pad(d.getDate())} (${WD[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dLong = iso => { const d = new Date(iso); return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} (${WD[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hasScore = r => r.score !== '' && r.score != null && !isNaN(+r.score);
const byNew = (a, b) => b.date.localeCompare(a.date);
const lapsTxt = r => r.laps.map(l => esc(l.name) + ' ' + fmt(l.sec)).join(' · ') || '랩 없음';
const wide = () => matchMedia('(min-width:900px)').matches;
function lapBar(r, big) {
  const D = SUBJ[r.subj].d * 60, w = s => (Math.min(s, D) / D * 100).toFixed(2) + '%';
  let h = r.laps.length ? r.laps.map((l, i) => `<i style="width:${w(l.sec)};background:${COL[i % COL.length]}"></i>`).join('') : `<i style="width:${w(r.total)};background:${COL[0]}"></i>`;
  if (big) { let a = 0; targets[r.subj].forEach(t => { a += t.min * 60; if (a < D) h += `<span class="tk" style="left:${w(a)}"></span>`; }); }
  return `<span class="lbar${big ? ' big' : ''}">${h}</span>`;
}

let rv = { f: 'all', sort: 'new', ...load('sn_rview', {}), q: '' }, recSel = null, dvId = null;
const saveRv = () => store('sn_rview', { f: rv.f, sort: rv.sort });
function filtered() {
  const q = rv.q.trim().toLowerCase();
  const sc = r => hasScore(r) ? +r.score : -Infinity;
  const by = { new: byNew, old: (a, b) => a.date.localeCompare(b.date), fast: (a, b) => a.total - b.total, score: (a, b) => sc(b) - sc(a) }[rv.sort] || byNew;
  return records.filter(r => (rv.f === 'all' || r.subj === rv.f) &&
    (!q || [dShort(r.date), r.memo, r.score, SUBJ[r.subj].name, SHORT[r.subj], ...r.laps.map(l => l.name)].join(' ').toLowerCase().includes(q))).sort(by);
}
function renderRecords() {
  $('#recSeg').innerHTML = [['all', '전체'], ...Object.entries(SHORT)].map(([k, v]) => `<button data-f="${k}" class="${k === rv.f ? 'on' : ''}">${v}</button>`).join('');
  $('#rsort').value = rv.sort;
  const list = filtered(), tot = list.map(r => r.total), sc = list.filter(hasScore).map(r => +r.score);
  $('#rsum').innerHTML = `<div><span>횟수</span><b>${list.length}</b></div><div><span>평균 소요</span><b>${list.length ? fmt(avg(tot)) : '–'}</b></div><div><span>최단</span><b>${list.length ? fmt(Math.min(...tot)) : '–'}</b></div><div><span>평균 점수</span><b>${sc.length ? avg(sc).toFixed(1) : '–'}</b></div>`;
  if (wide() && !list.some(r => r.id === recSel)) recSel = list[0]?.id || null;
  const row = r => `<button class="rrow${wide() && r.id === recSel ? ' sel' : ''}" data-id="${r.id}">
      <span class="tag ${r.subj}">${SHORT[r.subj]}</span>
      <span class="rmid"><span class="num">${dShort(r.date)}</span>${lapBar(r)}<span class="meta">${lapsTxt(r)}${r.memo ? ' — ' + esc(r.memo) : ''}</span></span>
      <span class="rr num"><b>${fmt(r.total)}</b>${hasScore(r) || r.score ? `<span class="sc">${esc(r.score)}점</span>` : ''}</span>
    </button>`;
  let h = '';
  if (!list.length) h = `<p class="muted">${records.length ? '조건에 맞는 기록이 없습니다.' : '기록이 없습니다. 타이머 종료 후 저장하거나 + 추가로 입력하세요.'}</p>`;
  else if (rv.sort === 'new' || rv.sort === 'old') {
    const g = new Map();
    list.forEach(r => { const d = new Date(r.date), k = `${d.getFullYear()}년 ${d.getMonth() + 1}월`; if (!g.has(k)) g.set(k, []); g.get(k).push(r); });
    g.forEach((rs, k) => h += `<div class="mhead"><span>${k}</span><span class="num">${rs.length}회 · 평균 ${fmt(avg(rs.map(r => r.total)))}</span></div><div class="glist">${rs.map(row).join('')}</div>`);
  } else h = `<div class="glist" style="margin-top:16px">${list.map(row).join('')}</div>`;
  $('#rlist').innerHTML = h;
  const r = records.find(x => x.id === recSel);
  $('#rdetail').innerHTML = r ? `<div class="dv">${detailHTML(r)}</div>` : '<div class="dempty">기록을 선택하세요</div>';
}
function detailHTML(r, inDlg) {
  const S = SUBJ[r.subj], lim = S.d * 60, T = targets[r.subj];
  const same = records.filter(x => x.subj === r.subj && x.id !== r.id);
  const prev = same.filter(x => x.date < r.date).sort(byNew)[0];
  const dif = d => `<b class="${d > 0 ? 'over' : 'under'}" style="font-weight:400">${fmtDiff(Math.round(d))}</b>`;
  const chips = [`여유 ${fmt(lim - r.total)}`];
  if (same.length) chips.push(`평균 대비 ${dif(r.total - avg(same.map(x => x.total)))}`);
  if (prev) {
    chips.push(`직전 대비 ${dif(r.total - prev.total)}`);
    if (hasScore(r) && hasScore(prev)) { const d = +r.score - +prev.score; chips.push(`점수 ${d > 0 ? '+' : ''}${d}`); }
  }
  let acc = 0;
  const rows = r.laps.map((l, i) => {
    const t = T.find(t => t.name === l.name) || T[i], pa = same.flatMap(x => x.laps.filter(y => y.name === l.name).map(y => y.sec));
    acc += l.sec;
    return `<tr><td><span class="dot" style="background:${COL[i % COL.length]}"></span>${esc(l.name)}</td><td>${fmt(l.sec)}</td>
      <td>${t ? dif(l.sec - t.min * 60) + `<span class="muted"> /${t.min}분</span>` : ''}</td><td>${pa.length ? dif(l.sec - avg(pa)) : ''}</td>
      <td class="muted">${clockStr(S.s * 60 + acc).slice(0, 5)}</td></tr>`;
  }).join('');
  const L = filtered(), i = L.findIndex(x => x.id === r.id);
  return `<div class="dh"><span class="tag ${r.subj}">${S.name}</span><span class="muted num">${dLong(r.date)}</span>${inDlg ? '<button class="ghost x" data-act="close">닫기</button>' : ''}</div>
    <div class="big num"><b>${fmt(r.total)}</b><span class="muted">/ ${S.d}:00</span>${r.score ? `<span class="sc" style="display:inline;font-size:16px;margin-left:auto">${esc(r.score)}점</span>` : ''}</div>
    ${lapBar(r, true)}
    <div class="chips num">${chips.map(c => `<span>${c}</span>`).join('')}</div>
    ${r.laps.length ? `<table class="ltab num"><thead><tr><th>구간</th><th>소요</th><th>목표 대비</th><th>평균 대비</th><th>종료</th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="muted" style="margin:0">구간 기록 없음</p>'}
    ${r.memo ? `<div class="memo">${esc(r.memo)}</div>` : ''}
    <div class="dnav"><button data-act="prev" ${i <= 0 ? 'disabled' : ''}>‹ 이전</button><button data-act="edit">수정</button><button data-act="next" ${i < 0 || i >= L.length - 1 ? 'disabled' : ''}>다음 ›</button></div>`;
}
function showDlg(id) {
  const r = records.find(x => x.id === id); if (!r) return;
  dvId = id; $('#dvBody').innerHTML = detailHTML(r, true);
  if (!$('#dlgView').open) $('#dlgView').showModal();
}
function openDetail(id) {
  if (!$('#v-rec').hidden && wide()) { recSel = id; renderRecords(); } else showDlg(id);
}
function navDetail(id, step) {
  const L = filtered(), n = L[L.findIndex(x => x.id === id) + step];
  if (n) $('#dlgView').open ? showDlg(n.id) : openDetail(n.id);
}
function detailAct(e) {
  const a = e.target.closest('[data-act]')?.dataset.act; if (!a) return;
  const inDlg = $('#dlgView').open, id = inDlg ? dvId : recSel;
  if (a === 'close') $('#dlgView').close();
  if (a === 'edit') { if (inDlg) $('#dlgView').close(); openEditor(id); }
  if (a === 'prev' || a === 'next') navDetail(id, a === 'next' ? 1 : -1);
}
function afterRecChange(id) {
  if (!$('#v-rec').hidden) renderRecords();
  renderLast();
  if (id) openDetail(id);
}
function renderLast() {
  const b = $('#lastRec'), r = run.status === 'idle' && records.filter(x => x.subj === run.subj).sort(byNew)[0];
  b.hidden = !r; if (!r) return;
  b.dataset.id = r.id;
  b.innerHTML = `<span class="lap-head" style="padding:0"><span>최근 기록 · ${dShort(r.date)}</span><span class="num">${fmt(r.total)}${r.score ? ' · ' + esc(r.score) + '점' : ''}</span></span>${lapBar(r)}<span class="meta">${lapsTxt(r)}</span>`;
}
function openEditor(id) {
  const r = id ? structuredClone(records.find(x => x.id === id)) : { id: null, subj: rv.f === 'all' ? run.subj : rv.f, date: new Date().toISOString(), total: 0, laps: [], score: '', memo: '' };
  const f = $('#edForm');
  const lapRows = () => r.laps.map((l, i) => `<div class="r"><input data-k="name" data-i="${i}" value="${esc(l.name)}" placeholder="구간 이름"><input data-k="sec" data-i="${i}" class="num" inputmode="decimal" value="${fmt(l.sec)}" placeholder="mm:ss"><button type="button" data-del="${i}" class="warn" aria-label="삭제">×</button></div>`).join('');
  const sum = () => r.laps.reduce((a, l) => a + l.sec, 0);
  f.innerHTML = `
    <h3>${id ? '기록 수정' : '기록 추가'}</h3>
    <div class="f2">
      <label class="f">과목<select name="subj">${Object.entries(SUBJ).map(([k, v]) => `<option value="${k}" ${k === r.subj ? 'selected' : ''}>${v.name}</option>`).join('')}</select></label>
      <label class="f">일시<input type="datetime-local" name="date" value="${toLocalInput(r.date)}"></label>
      <label class="f">총 소요 (mm:ss)<input name="total" class="num" inputmode="decimal" value="${fmt(r.total)}"></label>
      <label class="f">점수<input name="score" inputmode="numeric" value="${esc(r.score)}"></label>
    </div>
    <label class="f">메모<textarea name="memo">${esc(r.memo)}</textarea></label>
    <label class="f">구간 <span id="lapSum" class="num"></span></label>
    <div class="lapEd" id="lapEd">${lapRows()}</div>
    <button type="button" id="edAdd">+ 구간 추가</button>
    <div class="foot">
      ${id ? '<button type="button" id="edDel" class="warn">삭제</button>' : '<span></span>'}
      <button value="cancel" formnovalidate>취소</button>
      <button type="button" id="edSave" class="pri">저장</button>
    </div>`;
  const upSum = () => { $('#lapSum').textContent = r.laps.length ? `· 합계 ${fmt(sum())}` : ''; };
  const redraw = () => { $('#lapEd').innerHTML = lapRows(); upSum(); };
  upSum();
  $('#lapEd').oninput = e => {
    const i = +e.target.dataset.i, k = e.target.dataset.k;
    if (k === 'name') r.laps[i].name = e.target.value;
    if (k === 'sec') { const v = parseT(e.target.value); if (!isNaN(v)) { r.laps[i].sec = Math.round(v); upSum(); } }
  };
  $('#lapEd').onclick = e => { const d = e.target.dataset.del; if (d !== undefined) { r.laps.splice(+d, 1); redraw(); } };
  $('#edAdd').onclick = () => { const s = f.subj.value; r.laps.push({ name: lapName(s, r.laps.length), sec: 0 }); redraw(); };
  if (id) $('#edDel').onclick = () => { if (confirm('이 기록을 삭제할까요?')) { records = records.filter(x => x.id !== id); dels[id] = Date.now(); saveRecs(); $('#dlg').close(); if (recSel === id) recSel = null; afterRecChange(); toast('삭제됨'); } };
  $('#edSave').onclick = () => {
    const tot = parseT(f.total.value);
    if (isNaN(tot)) { alert('총 소요를 mm:ss 형식으로 입력하세요.'); return; }
    const d = new Date(f.date.value);
    Object.assign(r, { subj: f.subj.value, date: isNaN(d) ? r.date : d.toISOString(), total: Math.round(tot), score: f.score.value.trim(), memo: f.memo.value.trim(), u: Date.now() });
    if (id) records[records.findIndex(x => x.id === id)] = r;
    else { r.id = uid(); records.push(r); }
    records.sort((a, b) => b.date.localeCompare(a.date));
    saveRecs(); $('#dlg').close(); afterRecChange(r.id); toast('저장됨');
  };
  $('#dlg').showModal();
}
function exportJSON() {
  const blob = new Blob([JSON.stringify({ app: 'suneung-timer', v: 1, records, targets }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `suneung-timer-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importJSON(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const data = JSON.parse(rd.result), list = Array.isArray(data) ? data : data.records;
      if (!Array.isArray(list)) throw 0;
      const ids = new Set(records.map(r => r.id)); let n = 0;
      list.forEach(r => { if (r && SUBJ[r.subj] && Array.isArray(r.laps) && !ids.has(r.id)) { records.push({ ...r, id: r.id || uid(), u: Date.now() }); n++; } });
      if (data.targets && confirm('목표 구간 설정도 가져올까요?')) { targets = data.targets; saveTargets(); renderSettings(); }
      records.sort(byNew); saveRecs(); afterRecChange(); toast(`${n}개 기록 가져옴`);
    } catch (e) { alert('올바른 백업 파일이 아닙니다.'); }
  };
  rd.readAsText(file);
}
function buildPrint() {
  const list = filtered();
  $('#printSheet').innerHTML = `<h1>수능 실전 타이머 기록${rv.f === 'all' ? '' : ' · ' + SUBJ[rv.f].name}</h1>
    <p>${list.length}회${list.length ? ' · 평균 ' + fmt(avg(list.map(r => r.total))) : ''} · 출력 ${dateStr(new Date().toISOString())}</p>
    <table><thead><tr><th>일시</th><th>과목</th><th>총 소요</th><th>구간</th><th>점수</th><th>메모</th></tr></thead><tbody>
    ${list.map(r => `<tr><td class="num">${dLong(r.date)}</td><td>${SHORT[r.subj]}</td><td class="num">${fmt(r.total)} / ${SUBJ[r.subj].d}:00</td><td>${r.laps.map(l => esc(l.name) + ' ' + fmt(l.sec)).join('<br>')}</td><td>${esc(r.score)}</td><td>${esc(r.memo)}</td></tr>`).join('')}
    </tbody></table>`;
}

/* ───────── stats ───────── */
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : NaN;
function lineChart(vals, { ref, color, fmtY, minY, maxY }) {
  const W = 300, H = 110, L = 30, R = 8, T = 10, B = 16, n = vals.length;
  if (n < 2) return '<p class="muted" style="font-size:11px">추이는 2회 이상부터 표시됩니다.</p>';
  let lo = Math.min(...vals, ref ?? Infinity), hi = Math.max(...vals, ref ?? -Infinity);
  if (minY !== undefined) lo = Math.min(lo, minY); if (maxY !== undefined) hi = Math.max(hi, maxY);
  if (hi - lo < 1) { hi += 1; lo -= 1; }
  const pad_ = (hi - lo) * .12; lo -= pad_; hi += pad_;
  const x = i => L + (W - L - R) * i / (n - 1), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  let g = `<line x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}" stroke="var(--line)"/>`;
  [hi - pad_, lo + pad_].forEach(v => g += `<text x="${L - 4}" y="${y(v) + 3}" text-anchor="end">${fmtY(v)}</text>`);
  if (ref !== undefined) g += `<line x1="${L}" y1="${y(ref)}" x2="${W - R}" y2="${y(ref)}" stroke="var(--rose)" stroke-dasharray="3 3" stroke-width=".8"/><text x="${W - R}" y="${y(ref) - 3}" text-anchor="end">제한</text>`;
  g += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.4"/>`;
  vals.forEach((v, i) => g += `<circle cx="${x(i)}" cy="${y(v)}" r="2.2" fill="#fff" stroke="${color}" stroke-width="1.2"/>`);
  g += `<text x="${L}" y="${H - 3}">${n}회 전</text><text x="${W - R}" y="${H - 3}" text-anchor="end">최근</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function renderStats() {
  $('#sgrid').innerHTML = Object.entries(SUBJ).map(([k, S]) => {
    const rs = records.filter(r => r.subj === k).sort((a, b) => a.date.localeCompare(b.date));
    if (!rs.length) return `<div class="card"><h2 style="margin-top:0">${S.name}</h2><p class="muted">기록 없음</p></div>`;
    const tot = rs.map(r => r.total), sc = rs.filter(r => r.score !== '' && !isNaN(+r.score)).map(r => +r.score);
    const parts = {}, order = [];
    rs.forEach(r => r.laps.forEach(l => { if (!parts[l.name]) { parts[l.name] = []; order.push(l.name); } parts[l.name].push(l.sec); }));
    const tmap = Object.fromEntries(targets[k].map(t => [t.name, t.min * 60]));
    const rows = order.map(nm => {
      const a = avg(parts[nm]), t = tmap[nm], d = t !== undefined ? a - t : null;
      return `<tr><td>${esc(nm)} <span class="muted">(${parts[nm].length})</span></td><td class="num">${fmt(a)}</td><td class="num ${d > 0 ? 'over' : 'under'}">${d === null ? '' : fmtDiff(Math.round(d))}</td></tr>`;
    }).join('');
    const last = rs.slice(-12);
    return `<div class="card"><h2 style="margin-top:0">${S.name} <span class="muted">· ${rs.length}회</span></h2>
      <div class="kv num"><div><span>평균 소요</span><b>${fmt(avg(tot))}</b></div><div><span>최단</span><b>${fmt(Math.min(...tot))}</b></div><div><span>평균 점수</span><b>${sc.length ? avg(sc).toFixed(1) : '–'}</b></div></div>
      ${rows ? `<table class="parts"><tr><td class="muted">구간 평균</td><td></td><td class="muted">목표 대비</td></tr>${rows}</table>` : ''}
      ${lineChart(last.map(r => r.total), { ref: S.d * 60, color: 'var(--navy)', fmtY: v => Math.round(v / 60) + '분', minY: 0 })}
      <div class="sbars num">${rs.slice(-8).reverse().map(r => `<div data-id="${r.id}"><span class="muted">${dShort(r.date).slice(0, 5)}</span>${lapBar(r)}<span style="text-align:right">${fmt(r.total)}</span></div>`).join('')}</div>
      ${sc.length >= 2 ? lineChart(last.filter(r => r.score !== '' && !isNaN(+r.score)).map(r => +r.score), { color: 'var(--violet)', fmtY: v => Math.round(v) + '점' }) : ''}
    </div>`;
  }).join('');
}

/* ───────── settings ───────── */
function renderSettings() {
  $('#tsets').innerHTML = Object.entries(SUBJ).map(([k, S]) => {
    const sum = targets[k].reduce((a, t) => a + (+t.min || 0), 0);
    return `<div class="card tset" data-s="${k}"><h2 style="margin:0 0 4px">${S.name} <span class="muted num">· ${sum}/${S.d}분</span></h2>
      ${targets[k].map((t, i) => `<div class="r"><input data-k="name" data-i="${i}" value="${esc(t.name)}" placeholder="구간 이름"><input data-k="min" data-i="${i}" class="num" type="number" inputmode="numeric" min="0" value="${t.min}"><button type="button" data-del="${i}" class="warn" aria-label="삭제">×</button></div>`).join('')}
      <button type="button" data-add="1">+ 구간</button></div>`;
  }).join('');
}
$('#tsets').addEventListener('change', e => {
  const c = e.target.closest('[data-s]'), k = c?.dataset.s, i = +e.target.dataset.i;
  if (!k || !e.target.dataset.k) return;
  if (e.target.dataset.k === 'name') targets[k][i].name = e.target.value.trim() || `구간 ${i + 1}`;
  else targets[k][i].min = Math.max(0, +e.target.value || 0);
  saveTargets(); renderSettings(); renderLaps();
});
$('#tsets').addEventListener('click', e => {
  const c = e.target.closest('[data-s]'); if (!c) return; const k = c.dataset.s;
  if (e.target.dataset.del !== undefined) targets[k].splice(+e.target.dataset.del, 1);
  else if (e.target.dataset.add) targets[k].push({ name: `구간 ${targets[k].length + 1}`, min: 10 });
  else return;
  saveTargets(); renderSettings(); renderLaps();
});

/* ───────── gist sync ───────── */
const GH = 'https://api.github.com', GF = 'suneung-timer.json';
let sync = load('sn_sync', { token: '', gist: '', last: 0 }), syncing = false, syncAgain = false;
const saveSync = () => store('sn_sync', sync);
function syMsg(t) { const el = $('#syMsg'); if (el) el.textContent = t; }
function syStatus() { syMsg(!sync.token ? '연결 안 됨' : sync.last ? `마지막 동기화 ${new Date(sync.last).toLocaleString('ko-KR')}` : '연결됨 · 동기화 전'); }
async function gh(path, opt = {}) {
  const r = await fetch(GH + path, { ...opt, cache: 'no-store', headers: { Authorization: 'Bearer ' + sync.token, Accept: 'application/vnd.github+json', ...(opt.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (!r.ok) throw new Error(r.status === 401 ? '토큰이 올바르지 않음' : r.status === 404 ? 'Gist를 찾을 수 없음' : r.status === 403 ? '권한 없음(gist 권한 확인)' : 'HTTP ' + r.status);
  return r.json();
}
async function findGist() {
  for (let p = 1; p <= 10; p++) {
    const l = await gh(`/gists?per_page=100&page=${p}`), g = l.find(g => g.files[GF]);
    if (g) return g.id; if (l.length < 100) break;
  }
  return '';
}
const sig = d => JSON.stringify([d.records.map(r => r.id + ':' + (r.u || 0)).sort(), Object.entries(d.deleted || {}).sort(), d.targetsU || 0]);
const snap = () => ({ app: 'suneung-timer', v: 1, records, deleted: dels, targets, targetsU: tU });
let syncT = null;
function scheduleSync() { if (sync.token) { clearTimeout(syncT); syncT = setTimeout(doSync, 2000); } }
async function doSync(manual) {
  if (!sync.token) return;
  if (syncing) { syncAgain = true; return; }
  if (!navigator.onLine) { if (manual) toast('오프라인'); syMsg('오프라인 · 연결되면 동기화'); return; }
  syncing = true; syMsg('동기화 중…');
  try {
    if (!sync.gist) { sync.gist = await findGist(); saveSync(); }
    let R = { records: [], deleted: {}, targets: null, targetsU: 0 };
    if (sync.gist) {
      const f = (await gh('/gists/' + sync.gist)).files[GF];
      if (f) R = { ...R, ...JSON.parse(f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content) };
    }
    const localSig = sig(snap());
    // 병합: 기록은 u(수정 시각) 최신 우선, 삭제 기록은 이후 수정이 없으면 적용
    const del = { ...R.deleted };
    Object.entries(dels).forEach(([k, t]) => { if (!(del[k] >= t)) del[k] = t; });
    const m = new Map();
    [...R.records, ...records].forEach(r => { const o = m.get(r.id); if (!o || (r.u || 0) >= (o.u || 0)) m.set(r.id, r); });
    records = [...m.values()].filter(r => !(del[r.id] >= (r.u || 0))).sort((a, b) => b.date.localeCompare(a.date));
    dels = del;
    if (R.targets && R.targetsU > tU) { targets = R.targets; tU = R.targetsU; }
    store('sn_records', records); store('sn_del', dels); store('sn_targets', targets); store('sn_targets_u', tU);
    const out = snap();
    if (sig(out) !== sig(R) || !sync.gist) {
      const body = JSON.stringify({ description: '수능 실전 타이머 기록', files: { [GF]: { content: JSON.stringify(out) } }, ...(sync.gist ? {} : { public: false }) });
      const g = await gh(sync.gist ? '/gists/' + sync.gist : '/gists', { method: sync.gist ? 'PATCH' : 'POST', body });
      sync.gist = g.id;
    }
    sync.last = Date.now(); saveSync(); syStatus();
    if ($('#syGist')) $('#syGist').value = sync.gist;
    if (sig(out) !== localSig) {
      renderLaps(); renderLast();
      const v = ['rec', 'stat', 'set'].find(x => !$('#v-' + x).hidden);
      if (v === 'rec') renderRecords(); if (v === 'stat') renderStats(); if (v === 'set') renderSettings();
    }
    if (manual) toast('동기화 완료');
  } catch (e) { syMsg('동기화 실패: ' + e.message); if (manual) toast('동기화 실패'); }
  syncing = false;
  if (syncAgain) { syncAgain = false; doSync(); }
}
$('#syTok').value = sync.token; $('#syGist').value = sync.gist; syStatus();
$('#bSync').onclick = () => {
  const tok = $('#syTok').value.trim(), gid = $('#syGist').value.trim().replace(/^.*\//, '');
  if (!tok) { toast('토큰을 입력하세요'); return; }
  if (tok !== sync.token || gid !== sync.gist) sync = { token: tok, gist: gid, last: 0 };
  saveSync(); doSync(true);
};
$('#bSyncOff').onclick = () => { if (confirm('이 기기의 동기화 연결을 해제할까요? (기록은 유지)')) { sync = { token: '', gist: '', last: 0 }; saveSync(); $('#syTok').value = $('#syGist').value = ''; syStatus(); } };
window.addEventListener('online', () => doSync());

/* ───────── wiring ───────── */
function show(v) {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  ['timer', 'rec', 'stat', 'set'].forEach(x => $('#v-' + x).hidden = x !== v);
  if (v === 'rec') renderRecords(); if (v === 'stat') renderStats(); if (v === 'set') renderSettings();
  try { sessionStorage.setItem('sn_view', v); } catch (e) {}
}
$('#nav').onclick = e => { const v = e.target.dataset.v; if (v) show(v); };
$('#subjSeg').innerHTML = Object.entries(SUBJ).map(([k, S]) => {
  const e = S.s + S.d, hm = m => `${Math.floor(m / 60)}:${pad(m % 60)}`;
  return `<button data-s="${k}">${SHORT[k]} <span class="muted num" style="font-size:11px">${hm(S.s)}–${hm(e)}</span></button>`;
}).join('');
$('#subjSeg').onclick = e => { const b = e.target.closest('button'); if (b && run.status === 'idle') { run = idle(b.dataset.s); saveRun(); renderTimer(); } };
$('#bMain').onclick = () => ({ idle: start, running: pause, paused: resume }[run.status]?.());
$('#bLap').onclick = lap;
$('#bEnd').onclick = () => { if (confirm('시험을 종료하고 결과를 확정할까요?')) finish(); };
$('#bReset').onclick = resetRun;
$('#bDiscard').onclick = resetRun;
$('#bSave').onclick = saveRecord;
$('#bFocus').onclick = toggleFocus;
$('#laps').addEventListener('change', e => { const i = e.target.dataset.i; if (i !== undefined) { run.laps[+i].name = e.target.value.trim() || lapName(run.subj, +i); saveRun(); } });
$('#recSeg').onclick = e => { const f = e.target.dataset.f; if (f) { rv.f = f; saveRv(); renderRecords(); } };
$('#rsort').onchange = e => { rv.sort = e.target.value; saveRv(); renderRecords(); };
$('#rq').oninput = e => { rv.q = e.target.value; renderRecords(); };
$('#rlist').onclick = e => { const b = e.target.closest('[data-id]'); if (b) openDetail(b.dataset.id); };
$('#lastRec').onclick = e => showDlg(e.currentTarget.dataset.id);
$('#sgrid').onclick = e => { const b = e.target.closest('[data-id]'); if (b) showDlg(b.dataset.id); };
$('#rdetail').onclick = detailAct;
$('#dlgView').onclick = e => { if (e.target === $('#dlgView')) $('#dlgView').close(); else detailAct(e); };
let tx = null;
$('#dlgView').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
$('#dlgView').addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 70) navDetail(dvId, dx < 0 ? 1 : -1); });
matchMedia('(min-width:900px)').addEventListener('change', () => { if (!$('#v-rec').hidden) renderRecords(); });
$('#bNewRec').onclick = () => openEditor(null);
$('#bExport').onclick = exportJSON;
$('#bImport').onclick = () => $('#fImport').click();
$('#fImport').onchange = e => { if (e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ''; };
$('#bPrint').onclick = () => { buildPrint(); window.print(); };
window.addEventListener('beforeprint', buildPrint);
$('#bResetT').onclick = () => { if (confirm('목표 구간을 기본값으로 되돌릴까요?')) { targets = defTargets(); saveTargets(); renderSettings(); renderLaps(); } };
$('#bWipe').onclick = () => { if (confirm('모든 기록을 삭제할까요? 되돌릴 수 없습니다.')) { const now = Date.now(); records.forEach(r => dels[r.id] = now); records = []; saveRecs(); toast('모두 삭제됨'); } };
document.addEventListener('keydown', e => {
  if ($('#dlg').open || $('#dlgView').open || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || $('#v-timer').hidden) return;
  if (e.code === 'Space') { e.preventDefault(); $('#bMain').click(); }
  if (e.key === 'l' || e.key === 'Enter') { e.preventDefault(); if (run.status === 'running') lap(); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tick(); if (run.status === 'running') wake(true); doSync(); } });

if (!SUBJ[run.subj]) run = idle('kor');
buildClock();
renderTimer();
try { const v = sessionStorage.getItem('sn_view'); if (v && v !== 'timer') show(v); } catch (e) {}
doSync();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
